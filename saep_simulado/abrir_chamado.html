<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMaq - Abrir Chamado</title>
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
    <div class="layout-wrapper">
        <header class="main-header navbar-between">
            <div class="header-brand">
                <div class="logo-icon"></div>
                <div>
                    <h1>TechMaq</h1>
                    <p>Novo Chamado de Manutenção</p>
                </div>
            </div>
            <a href="painel.html" class="btn btn-outline btn-sm">← Voltar ao Painel</a>
        </header>

        <main class="main-content flex-center">
            <div class="card form-card">
                <h2>Registar Chamado</h2>
                <p class="subtitle">Selecione o equipamento e descreva a anomalia verificada.</p>

                <div id="alert" class="alert hidden"></div>

                <form id="chamadoForm" novalidate>
                    <div class="form-group">
                        <label for="equipamento_id">Equipamento</label>
                        <select id="equipamento_id" required>
                            <option value="">Selecione um equipamento...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prioridade">Nível de Prioridade</label>
                        <select id="prioridade" required>
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição Pormenorizada do Problema</label>
                        <textarea id="descricao" rows="4" placeholder="Descreva os sintomas, barulhos, vazamentos ou avarias observadas..." required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salvar Chamado</button>
                        <a href="painel.html" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="assets/app.js"></script>
    <script>
        App.checkAuth();

        const equipamentos = App.getEquipamentos();
        const select = document.getElementById('equipamento_id');

        equipamentos.forEach(e => {
            const opt = document.createElement('option');
            opt.value = e.id;
            opt.textContent = `${e.nome} (${e.setor})`;
            select.appendChild(opt);
        });

        document.getElementById('chamadoForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const equipId = parseInt(document.getElementById('equipamento_id').value);
            const prioridade = document.getElementById('prioridade').value;
            const descricao = document.getElementById('descricao').value.trim();

            const res = App.abrirChamado(equipId, descricao, prioridade);
            if (res.success) {
                alert(res.message);
                window.location.href = 'painel.html';
            } else {
                App.showAlert(res.message, 'danger');
            }
        });
    </script>
</body>
</html>
