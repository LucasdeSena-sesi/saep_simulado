<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMaq - Cadastro de Usuário</title>
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
    <div class="layout-wrapper">
        <header class="main-header">
            <div class="header-brand">
                <div class="logo-icon"></div>
                <div>
                    <h1>TechMaq</h1>
                    <p>Gestão Industrial de Manutenção</p>
                </div>
            </div>
        </header>

        <main class="main-content flex-center">
            <div class="card auth-card">
                <h2>Criar Conta</h2>
                <p class="subtitle">Registe um novo utilizador para aceder à plataforma.</p>

                <div id="alert" class="alert hidden"></div>

                <form id="cadastroForm" novalidate>
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Ex: João Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="exemplo@techmaq.com" required>
                    </div>

                    <div class="form-group">
                        <label for="senha">Palavra-passe</label>
                        <input type="password" id="senha" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Registar Conta</button>
                </form>

                <div class="auth-footer">
                    <p>Já tem uma conta? <a href="index.html">Voltar ao Login</a></p>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/app.js"></script>
    <script>
        document.getElementById('cadastroForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();

            const res = App.cadastrarUsuario(nome, email, senha);
            if (res.success) {
                alert(res.message);
                window.location.href = 'index.html';
            } else {
                App.showAlert(res.message, 'danger');
            }
        });
    </script>
</body>
</html>
